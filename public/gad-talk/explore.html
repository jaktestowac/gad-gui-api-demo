<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/data/icons/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore - GadTalk</title>
    <link rel="stylesheet" href="/gad-talk/css/gad-talk.css">
    <link href="/css/fontawesome/css/all.min.css" rel="stylesheet" />
</head>

<body class="gt-app-layout">
    <!-- Navbar -->
    <nav class="gt-navbar">
        <div class="gt-container-wide gt-flex gt-justify-between gt-items-center">
            <a href="/" class="gt-link-muted">🦎 GAD</a>
            <a href="/gad-talk/" class="gt-navbar-brand">
                <span class="gt-logo"><i class="fa-solid fa-comments"></i></span>
                <span>GadTalk</span>
            </a>
            <div class="gt-flex gt-gap-sm gt-items-center" id="nav-user-section">
                <!-- Populated by JS -->
            </div>
        </div>
    </nav>

    <!-- Main layout -->
    <div class="gt-main-container">
        <!-- Left sidebar -->
        <aside class="gt-sidebar gt-sidebar-left">
            <nav class="gt-nav-menu" id="main-nav">
                <a href="/gad-talk/index.html" class="gt-nav-item" data-testid="nav-home">
                    <span class="gt-nav-icon"><i class="fa-solid fa-house"></i></span>
                    <span class="gt-nav-text">Home</span>
                </a>
                <a href="/gad-talk/explore.html" class="gt-nav-item gt-nav-item-active" data-testid="nav-explore">
                    <span class="gt-nav-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <span class="gt-nav-text">Explore</span>
                </a>
                <a href="/gad-talk/notifications.html" class="gt-nav-item" data-testid="nav-notifications">
                    <span class="gt-nav-icon"><i class="fa-solid fa-bell"></i></span>
                    <span class="gt-nav-text">Notifications</span>
                    <span class="gt-badge gt-badge-primary gt-hidden" id="notification-badge">0</span>
                </a>
                <a href="/gad-talk/bookmarks.html" class="gt-nav-item" data-testid="nav-bookmarks">
                    <span class="gt-nav-icon"><i class="fa-solid fa-bookmark"></i></span>
                    <span class="gt-nav-text">Bookmarks</span>
                </a>
                <a href="#" class="gt-nav-item" id="nav-profile" data-testid="nav-profile">
                    <span class="gt-nav-icon"><i class="fa-solid fa-user"></i></span>
                    <span class="gt-nav-text">Profile</span>
                </a>
                <button class="gt-btn gt-btn-primary gt-btn-block gt-mt-lg" id="compose-btn" data-testid="compose-button">
                    Gad
                </button>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="gt-content">
            <!-- Header -->
            <header class="gt-page-header">
                <h1 class="gt-page-title">Explore</h1>
            </header>

            <!-- Search section -->
            <div class="gt-card gt-mb-md">
                <form id="search-form" class="gt-search-form" data-testid="search-form">
                    <div class="gt-search-input-wrapper">
                        <span class="gt-search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="search" id="search-input" class="gt-search-input" placeholder="Search GadTalk" data-testid="search-input" autocomplete="off" />
                        <!-- Autocomplete suggestions dropdown -->
                        <div class="gt-search-suggestions gt-hidden" id="search-suggestions" data-testid="search-suggestions">
                            <div class="gt-suggestions-content" id="suggestions-content">
                                <!-- Suggestions will be populated here -->
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Trending section -->
            <section class="gt-card">
                <h2 class="gt-section-title">Trending Hashtags</h2>
                <div id="trending-list" class="gt-trending-list" data-testid="trending-list">
                    <!-- Loading -->
                    <div class="gt-loading-section" id="trending-loading">
                        <div class="gt-spinner"></div>
                        <span>Loading trends...</span>
                    </div>
                </div>
            </section>

            <!-- Popular Gads section -->
            <section class="gt-card gt-mt-md">
                <h2 class="gt-section-title">Popular Gads</h2>
                <div id="popular-gads" class="gt-gads-list" data-testid="popular-gads">
                    <!-- Loading -->
                    <div class="gt-loading-section" id="popular-loading">
                        <div class="gt-spinner"></div>
                        <span>Loading popular gads...</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Right sidebar -->
        <aside class="gt-sidebar gt-sidebar-right">
            <div class="gt-card">
                <h3 class="gt-card-title">Who to follow</h3>
                <div id="suggestions-list" class="gt-suggestions-list" data-testid="suggestions-list">
                    <!-- Loading -->
                    <div class="gt-loading-section" id="suggestions-loading">
                        <span class="gt-text-secondary">Loading...</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="/gad-talk/js/api.js"></script>
    <script src="/gad-talk/js/ui.js"></script>
    <script src="/gad-talk/js/auth.js"></script>
    <script src="/gad-talk/js/gads.js"></script>
    <script src="/gad-talk/js/nav.js"></script>
    <script>
        (async function () {
            // Require authentication
            const currentUser = await window.gadTalkAuth.requireAuth();
            if (!currentUser) return;

            // Update nav profile link
            const navProfile = document.getElementById("nav-profile");
            if (navProfile) {
                navProfile.href = `/gad-talk/profile.html?user=${currentUser.username}`;
            }

            // nav.js populates nav-user-section and dropdown

            // Load trending hashtags
            loadTrending();

            // Handle search
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const searchSuggestions = document.getElementById('search-suggestions');
            const suggestionsContent = document.getElementById('suggestions-content');

            let debounceTimer = null;
            let selectedIndex = -1;

            // Autocomplete suggestions
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const query = searchInput.value.trim();

                if (query.length < 2) {
                    hideSuggestions();
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    try {
                        const response = await window.GadTalkAPI.search.getSuggestions(query);
                        renderSuggestions(response);
                    } catch (error) {
                        console.error('Failed to load suggestions:', error);
                        hideSuggestions();
                    }
                }, 200);
            });

            // Keyboard navigation for suggestions
            searchInput.addEventListener('keydown', (e) => {
                if (searchSuggestions.classList.contains('gt-hidden')) return;

                const items = suggestionsContent.querySelectorAll('.gt-suggestion-item');

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    updateSelectedItem(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, -1);
                    updateSelectedItem(items);
                } else if (e.key === 'Enter' && selectedIndex >= 0) {
                    e.preventDefault();
                    items[selectedIndex].click();
                } else if (e.key === 'Escape') {
                    hideSuggestions();
                }
            });

            // Hide suggestions when clicking outside
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
                    hideSuggestions();
                }
            });

            function renderSuggestions(data) {
                const { users = [], hashtags = [], recentSearches = [] } = data;

                if (users.length === 0 && hashtags.length === 0) {
                    suggestionsContent.innerHTML = `
                        <div class="gt-suggestions-empty">No suggestions found</div>
                    `;
                    showSuggestions();
                    return;
                }

                let html = '';

                // Users section
                if (users.length > 0) {
                    html += `<div class="gt-suggestion-section">Users</div>`;
                    html += users.map(user => `
                        <div class="gt-suggestion-item" data-type="user" data-value="${user.username}">
                            <div class="gt-suggestion-icon gt-suggestion-user">
                                <img src="${user.avatar || '/gad-talk/images/default-avatar.png'}" alt="${user.name}" />
                            </div>
                            <div class="gt-suggestion-text">
                                <div class="gt-suggestion-primary">${user.name}</div>
                                <div class="gt-suggestion-secondary">@${user.username}</div>
                            </div>
                        </div>
                    `).join('');
                }

                // Hashtags section
                if (hashtags.length > 0) {
                    html += `<div class="gt-suggestion-section">Hashtags</div>`;
                    html += hashtags.map(tag => `
                        <div class="gt-suggestion-item" data-type="hashtag" data-value="${tag.tag}">
                            <div class="gt-suggestion-icon">
                                <i class="fa-solid fa-hashtag"></i>
                            </div>
                            <div class="gt-suggestion-text">
                                <div class="gt-suggestion-primary">#${tag.tag}</div>
                                <div class="gt-suggestion-secondary">${tag.count || 0} gads</div>
                            </div>
                        </div>
                    `).join('');
                }

                suggestionsContent.innerHTML = html;
                selectedIndex = -1;

                // Add click handlers
                suggestionsContent.querySelectorAll('.gt-suggestion-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const type = item.dataset.type;
                        const value = item.dataset.value;

                        if (type === 'user') {
                            window.location.href = `/gad-talk/profile.html?user=${value}`;
                        } else if (type === 'hashtag') {
                            window.location.href = `/gad-talk/explore.html?hashtag=${value}`;
                        } else {
                            searchInput.value = value;
                            searchForm.dispatchEvent(new Event('submit'));
                        }
                    });
                });

                showSuggestions();
            }

            function showSuggestions() {
                searchSuggestions.classList.remove('gt-hidden');
            }

            function hideSuggestions() {
                searchSuggestions.classList.add('gt-hidden');
                selectedIndex = -1;
            }

            function updateSelectedItem(items) {
                items.forEach((item, idx) => {
                    if (idx === selectedIndex) {
                        item.classList.add('gt-suggestion-active');
                    } else {
                        item.classList.remove('gt-suggestion-active');
                    }
                });
            }

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                hideSuggestions();
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `/gad-talk/search.html?q=${encodeURIComponent(query)}`;
                }
            });

            // Check URL for hashtag param
            const urlParams = new URLSearchParams(window.location.search);
            const hashtag = urlParams.get('hashtag');
            if (hashtag) {
                loadHashtagGads(hashtag);
            } else {
                // Load popular gads when no hashtag is specified
                loadPopularGads();
            }

            // Load user suggestions
            loadSuggestions();

            async function loadTrending() {
                const trendingList = document.getElementById('trending-list');
                const trendingLoading = document.getElementById('trending-loading');

                try {
                    const response = await window.GadTalkAPI.gads.getTrending(5);
                    const hashtags = response.hashtags || [];

                    trendingLoading.classList.add('gt-hidden');

                    if (hashtags.length === 0) {
                        trendingList.innerHTML = `
                            <div class="gt-empty-state-sm">
                                <p class="gt-text-secondary">No trending hashtags yet. Start posting with #hashtags!</p>
                            </div>
                        `;
                        return;
                    }

                    trendingList.innerHTML = hashtags.map((tag, idx) => `
                        <a href="/gad-talk/explore.html?hashtag=${tag.tag}" class="gt-trending-item" data-testid="trending-item-${idx}">
                            <div class="gt-trending-info">
                                <span class="gt-trending-tag">#${tag.tag}</span>
                                <span class="gt-trending-count">${tag.count} Gads</span>
                            </div>
                        </a>
                    `).join('');
                } catch (error) {
                    console.error('Failed to load trending:', error);
                    trendingLoading.classList.add('gt-hidden');
                    trendingList.innerHTML = `
                        <div class="gt-empty-state-sm">
                            <p class="gt-text-secondary">No trending hashtags available</p>
                        </div>
                    `;
                }
            }

            async function loadPopularGads() {
                const popularGads = document.getElementById('popular-gads');
                const popularLoading = document.getElementById('popular-loading');

                try {
                    const response = await window.GadTalkAPI.gads.getPopular(1, 10);
                    const gads = response.gads || [];

                    popularLoading.classList.add('gt-hidden');

                    if (gads.length === 0) {
                        popularGads.innerHTML = `
                            <div class="gt-empty-state">
                                <div class="gt-empty-icon"><i class="fa-solid fa-fire"></i></div>
                                <h3 class="gt-empty-title">No popular Gads yet</h3>
                                <p class="gt-empty-message">Be the first to create engaging content!</p>
                            </div>
                        `;
                        return;
                    }

                    window.gadTalkGads.renderGads(gads, popularGads, currentUser.id);
                } catch (error) {
                    console.error('Failed to load popular gads:', error);
                    popularLoading.classList.add('gt-hidden');
                    popularGads.innerHTML = `
                        <div class="gt-empty-state-sm">
                            <p class="gt-text-secondary">No popular gads available</p>
                        </div>
                    `;
                }
            }

            async function loadSuggestions() {
                const suggestionsList = document.getElementById('suggestions-list');
                const suggestionsLoading = document.getElementById('suggestions-loading');

                try {
                    const response = await window.GadTalkAPI.users.getSuggestions(5);
                    const users = response.users || [];

                    suggestionsLoading.classList.add('gt-hidden');

                    if (users.length === 0) {
                        suggestionsList.innerHTML = `
                            <p class="gt-text-secondary gt-text-sm">No suggestions available</p>
                        `;
                        return;
                    }

                    suggestionsList.innerHTML = users.map(user => `
                        <div class="gt-suggestion-user" data-testid="suggestion-${user.id}">
                            <a href="/gad-talk/profile.html?user=${user.username}" class="gt-suggestion-user-info">
                                <img src="${user.avatar || '/gad-talk/images/default-avatar.png'}" alt="${user.displayName}" class="gt-avatar gt-avatar-sm" />
                                <div class="gt-suggestion-user-text">
                                    <span class="gt-suggestion-user-name">${user.displayName}</span>
                                    <span class="gt-suggestion-user-handle">@${user.username}</span>
                                </div>
                            </a>
                            <button class="gt-btn gt-btn-sm gt-btn-outline gt-follow-btn" 
                                    data-user-id="${user.id}"
                                    data-testid="follow-btn-${user.id}">
                                Follow
                            </button>
                        </div>
                    `).join('');

                    // Add follow button handlers
                    suggestionsList.querySelectorAll('.gt-follow-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.preventDefault();
                            const userId = btn.dataset.userId;
                            try {
                                if (btn.classList.contains('gt-following')) {
                                    await window.GadTalkAPI.users.unfollow(userId);
                                    btn.classList.remove('gt-following');
                                    btn.textContent = 'Follow';
                                } else {
                                    await window.GadTalkAPI.users.follow(userId);
                                    btn.classList.add('gt-following');
                                    btn.textContent = 'Following';
                                }
                            } catch (error) {
                                console.error('Follow action failed:', error);
                            }
                        });
                    });
                } catch (error) {
                    console.error('Failed to load suggestions:', error);
                    suggestionsLoading.classList.add('gt-hidden');
                    suggestionsList.innerHTML = `
                        <p class="gt-text-secondary gt-text-sm">No suggestions available</p>
                    `;
                }
            }

            async function loadHashtagGads(hashtag) {
                const popularSection = document.querySelector('.gt-card.gt-mt-md');
                const popularGads = document.getElementById('popular-gads');
                const popularLoading = document.getElementById('popular-loading');

                popularSection.querySelector('h2').textContent = `#${hashtag}`;

                try {
                    const response = await window.GadTalkAPI.gads.getByHashtag(hashtag);
                    const gads = response.gads || [];

                    popularLoading.classList.add('gt-hidden');

                    if (gads.length === 0) {
                        popularGads.innerHTML = `
                            <div class="gt-empty-state">
                                <div class="gt-empty-icon"><i class="fa-solid fa-inbox"></i></div>
                                <h3 class="gt-empty-title">No Gads yet</h3>
                                <p class="gt-empty-message">Be the first to post with #${hashtag}</p>
                            </div>
                        `;
                        return;
                    }

                    window.gadTalkGads.renderGads(gads, popularGads, currentUser.id);
                } catch (error) {
                    console.error('Failed to load hashtag gads:', error);
                    popularLoading.classList.add('gt-hidden');
                    popularGads.innerHTML = `
                        <div class="gt-empty-state-sm">
                            <p class="gt-text-secondary">Could not load gads for #${hashtag}</p>
                        </div>
                    `;
                }
            }
        })();
    </script>
</body>

</html>
