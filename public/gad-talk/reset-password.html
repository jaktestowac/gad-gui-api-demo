<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/data/icons/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - GadTalk</title>
    <link rel="stylesheet" href="/gad-talk/css/gad-talk.css">
    <link href="/css/fontawesome/css/all.min.css" rel="stylesheet" />
</head>

<body class="gt-auth-layout">
    <!-- Navbar -->
    <nav class="gt-navbar">
        <div class="gt-container-wide gt-flex gt-justify-between gt-items-center">
            <a href="/" class="gt-link-muted">🦎 GAD</a>
            <a href="/gad-talk/" class="gt-navbar-brand">
                <span class="gt-logo"><i class="fa-solid fa-comments"></i></span>
                <span>GadTalk</span>
            </a>
            <div class="gt-flex gt-gap-sm">
                <a href="/gad-talk/login.html" data-testid="login-link" class="gt-btn gt-btn-secondary gt-btn-sm">
                    Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <div class="gt-auth-container">
        <div class="gt-auth-card gt-card gt-card-glow">
            <div class="gt-auth-header">
                <a href="/gad-talk/" class="gt-navbar-brand">
                    <span class="gt-logo"><i class="fa-solid fa-comments"></i></span>
                    <span>GadTalk</span>
                </a>
                <p class="gt-auth-subtitle">Set a new password (valid for 15 minutes)</p>
            </div>

            <!-- Error/Success messages -->
            <div id="error-message" class="gt-alert gt-alert-error gt-hidden" data-testid="error-message"></div>
            <div id="success-message" class="gt-alert gt-alert-success gt-hidden" data-testid="success-message"></div>

            <!-- Reset password form -->
            <form id="reset-password-form" data-testid="reset-password-form">
                <div class="gt-field">
                    <label for="token" class="gt-label">Reset token</label>
                    <input type="text" id="token" name="token" data-testid="reset-token-input" required class="gt-input" placeholder="Paste your reset token" />
                </div>

                <div class="gt-field">
                    <label for="password" class="gt-label">New password</label>
                    <input type="password" id="password" name="password" data-testid="password-input" required autocomplete="new-password" class="gt-input" placeholder="••••••••" />
                </div>

                <div class="gt-field">
                    <label for="confirmPassword" class="gt-label">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" data-testid="confirm-password-input" required autocomplete="new-password" class="gt-input" placeholder="••••••••" />
                </div>

                <button type="submit" data-testid="reset-password-button" class="gt-btn gt-btn-primary gt-btn-block gt-btn-lg">
                    Reset password
                </button>
            </form>

            <div class="gt-text-center gt-mt-md">
                <a href="/gad-talk/login.html" class="gt-link" data-testid="back-to-login-link">Back to login</a>
            </div>
        </div>
    </div>

    <script src="/gad-talk/js/api.js"></script>
    <script src="/gad-talk/js/ui.js"></script>
    <script src="/gad-talk/js/auth.js"></script>
</body>

</html>
