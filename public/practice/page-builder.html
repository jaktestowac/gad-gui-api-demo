    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Builder Styles */
        .builder-item {
            cursor: grab;
            transition: all 0.2s;
        }

        .builder-item:active {
            cursor: grabbing;
        }

        /* The Canvas Item Wrapper */
        .canvas-item {
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .canvas-item:hover {
            border-color: #3b82f6;
            /* Blue border on hover */
        }

        /* Control Buttons (Delete, Move) */
        .item-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 5px;
            z-index: 50;
            background: white;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .canvas-item:hover .item-controls {
            display: flex;
        }

        /* Editable Text Outline */
        [contenteditable]:focus {
            outline: 2px dashed #fbbf24;
            background-color: rgba(251, 191, 36, 0.1);
            padding: 2px;
            border-radius: 2px;
        }

        /* Property Target Highlight */
        .property-target:hover {
            outline: 2px solid #10b981;
            /* Green highlight for attribute targets */
            cursor: pointer;
        }

        .property-target.active-target {
            outline: 3px solid #f97316;
            /* Orange highlight for active element */
            z-index: 10;
        }

        /* Drag Over Effect */
        .drag-over {
            background-color: #eff6ff;
            border: 2px dashed #3b82f6;
        }

        /* Settings Panel Positioning */
        #property-editor {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 60;
            display: none;
        }
    </style>
</head>

        // --- Core Application State & Elements ---
        const sidebarList = document.getElementById('components-list');
        const canvas = document.getElementById('canvas');
        const emptyState = document.getElementById('empty-state');
        const livePreviewPanel = document.getElementById('live-preview-panel');
        const livePreviewIframe = document.getElementById('live-preview-iframe');
        const previewText = document.getElementById('preview-text');
        const propertyEditor = document.getElementById('property-editor');
        const propertyFields = document.getElementById('property-fields');

        let isPreviewOpen = false;
        let activePropertyElement = null;

        // --- Initialization ---

        // Render Sidebar Items
        componentLibrary.forEach(comp => {
            const div = document.createElement('div');
            div.className = 'builder-item bg-white p-3 rounded-lg border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-400 flex items-center gap-3 select-none';
            div.draggable = true;
            div.setAttribute('data-id', comp.id);
            div.innerHTML = `
                <div class="w-8 h-8 bg-gray-100 rounded flex items-center justify-center text-gray-500">
                    <i class="fa-solid ${comp.icon}"></i>
                </div>
                <span class="font-medium text-sm text-gray-700">${comp.name}</span>
            `;

            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', comp.id);
                e.dataTransfer.effectAllowed = 'copy';
                closeSettingsPanel(); // Close editor when starting drag
            });

            sidebarList.appendChild(div);
        });

        // Add event listener for contentEditable changes and property editing
        canvas.addEventListener('input', updateLivePreview);
        canvas.addEventListener('click', handleCanvasClick);

        // --- Live Preview Logic ---

        function toggleLivePreview() {
            isPreviewOpen = !isPreviewOpen;

            if (isPreviewOpen) {
                // Open panel
                livePreviewPanel.classList.remove('w-0');
                livePreviewPanel.classList.add('w-[400px]');
                previewText.textContent = 'Hide Live Preview';
                updateLivePreview();
            } else {
                // Close panel
                livePreviewPanel.classList.add('w-0');
                livePreviewPanel.classList.remove('w-[400px]');
                previewText.textContent = 'Show Live Preview';
            }
        }

        function getCanvasHtml(isFullDocument = false) {
            // 1. Clone the canvas content
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = canvas.innerHTML;

            // 2. Remove editor controls and wrappers
            tempDiv.querySelectorAll('#empty-state').forEach(el => el.remove());
            tempDiv.querySelectorAll('.item-controls').forEach(el => el.remove());

            const finalContentContainer = document.createElement('div');
            tempDiv.querySelectorAll('.canvas-item').forEach(item => {
                const contentDiv = item.lastElementChild;
                finalContentContainer.innerHTML += contentDiv.innerHTML;
            });

            // 3. Cleanup: Remove editor-specific attributes and highlights
            finalContentContainer.querySelectorAll('.property-target').forEach(el => el.classList.remove('property-target', 'active-target'));
            finalContentContainer.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            finalContentContainer.querySelectorAll('[data-attribute]').forEach(el => el.removeAttribute('data-attribute'));


            const contentHtml = finalContentContainer.innerHTML;

            if (isFullDocument) {
                // Full HTML for export
                return `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"><\/script>
</head>
<body class="font-sans antialiased text-gray-800 bg-white">
    ${contentHtml}
</body>
</html>`;
            } else {
                // Content HTML for iframe srcdoc
                // CRITICAL FIX: Escape the closing script tags to avoid premature termination of the main script block
                const tailwindScript = '<script src="https://cdn.tailwindcss.com"><\/script>';
                const fontAwesomeScript = '<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"><\/script>';
                const bodyClasses = 'font-sans antialiased text-gray-800 bg-white';

                return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Preview</title>${tailwindScript}${fontAwesomeScript}</head><body class="${bodyClasses}">${contentHtml}</body></html>`;
            }
        }

        function updateLivePreview() {
            if (isPreviewOpen) {
                const previewHtml = getCanvasHtml(false);
                // Use srcdoc to update iframe content instantly
                livePreviewIframe.srcdoc = previewHtml;
            }
        }

        function previewPage() {
            const fullHtml = getCanvasHtml(true);
            // Create a Blob and open in new tab
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        // --- Drag & Drop Handlers ---
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            canvas.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            canvas.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            canvas.classList.remove('drag-over');

            if (emptyState && emptyState.parentNode) {
                emptyState.remove();
            }

            const compId = e.dataTransfer.getData('text/plain');
            const component = componentLibrary.find(c => c.id === compId);

            if (component) {
                addComponentToCanvas(component);
            }
        }

        function addComponentToCanvas(component) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-item group';

            // Controls (Move Up, Move Down, Delete)
            const controls = document.createElement('div');
            controls.className = 'item-controls';
            controls.innerHTML = `
                <button onclick="moveUp(this); updateLivePreview();" class="p-1.5 bg-gray-100 hover:bg-white text-gray-600 rounded border border-gray-200" title="Move Up"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                <button onclick="moveDown(this); updateLivePreview();" class="p-1.5 bg-gray-100 hover:bg-white text-gray-600 rounded border border-gray-200" title="Move Down"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                <button onclick="deleteItem(this)" class="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded border border-red-200" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
            `;

            // Content Container
            const content = document.createElement('div');
            content.innerHTML = component.html;

            wrapper.appendChild(controls);
            wrapper.appendChild(content);
            canvas.appendChild(wrapper);

            canvas.scrollTop = canvas.scrollHeight;
            updateLivePreview();
        }

        // --- Canvas Item Actions ---
        function deleteItem(btn) {
            // Note: updateLivePreview is called inside checkEmpty
            const item = btn.closest('.canvas-item');
            item.remove();
            checkEmpty();
            closeSettingsPanel();
        }

        function moveUp(btn) {
            const item = btn.closest('.canvas-item');
            if (item.previousElementSibling) {
                item.parentNode.insertBefore(item, item.previousElementSibling);
            }
        }

        function moveDown(btn) {
            const item = btn.closest('.canvas-item');
            if (item.nextElementSibling) {
                item.parentNode.insertBefore(item.nextElementSibling, item);
            }
        }

        function clearCanvas() {
            if (confirm("Are you sure you want to clear the page?")) {
                canvas.innerHTML = '';
                canvas.appendChild(emptyState);
                closeSettingsPanel();
                updateLivePreview();
            }
        }

        function checkEmpty() {
            if (canvas.children.length === 0) {
                canvas.appendChild(emptyState);
            }
            updateLivePreview();
        }


        // --- Property Editor Logic ---

        function handleCanvasClick(e) {
            // Check if the click was on an element we want to expose properties for
            const target = e.target.closest('.property-target');

            // If the user clicked inside the canvas but not a property target, and not contenteditable, do nothing
            if (e.target.closest('#canvas') && !target && !e.target.hasAttribute('contenteditable')) {
                return;
            }

            // Prevent default action (e.g., following a link)
            if (target) {
                e.preventDefault();
                e.stopPropagation();
                openSettingsPanel(target);
            } else if (e.target.hasAttribute('contenteditable')) {
                // If it's a text edit, close the property panel if it's open for a different element
                if (activePropertyElement && activePropertyElement !== e.target) {
                    closeSettingsPanel();
                }
            } else {
                // Clicked elsewhere, close panel
                closeSettingsPanel();
            }
        }

        function openSettingsPanel(element) {
            // 1. Clear previous active element highlight
            if (activePropertyElement) {
                activePropertyElement.classList.remove('active-target');
            }

            // 2. Set new active element and highlight it
            activePropertyElement = element;
            activePropertyElement.classList.add('active-target');

            // 3. Determine which attributes to display
            const tag = element.tagName.toLowerCase();
            let attributes = [];

            if (element.hasAttribute('data-attribute')) {
                // Use custom list defined in the template (e.g., 'placeholder,name,type')
                attributes = element.getAttribute('data-attribute').split(',');
            } else if (tag === 'a' || tag === 'button') {
                attributes = ['href', 'target'];
            } else if (tag === 'input') {
                attributes = ['placeholder', 'type', 'name'];
            }

            // 4. Build the form fields
            propertyFields.innerHTML = '';

            if (attributes.length === 0) {
                propertyFields.innerHTML = '<p class="text-sm text-gray-500">No configurable properties found for this element.</p>';
            } else {
                attributes.forEach(attrName => {
                    const cleanName = attrName.trim();
                    const currentValue = element.getAttribute(cleanName) || '';

                    const fieldDiv = document.createElement('div');
                    fieldDiv.className = 'space-y-1';
                    fieldDiv.innerHTML = `
                        <label class="block text-xs font-medium text-gray-700">${cleanName.charAt(0).toUpperCase() + cleanName.slice(1)}</label>
                        <input type="text" 
                               data-attr-name="${cleanName}"
                               value="${currentValue}" 
                               oninput="updateProperty(this)"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
                    `;
                    propertyFields.appendChild(fieldDiv);
                });
            }

            // 5. Show the panel
            propertyEditor.style.display = 'block';
        }

        function closeSettingsPanel() {
            if (activePropertyElement) {
                activePropertyElement.classList.remove('active-target');
            }
            activePropertyElement = null;
            propertyEditor.style.display = 'none';
        }

        function updateProperty(inputElement) {
            if (!activePropertyElement) return;

            const attrName = inputElement.getAttribute('data-attr-name');
            const newValue = inputElement.value;

            if (newValue.trim() === '') {
                // If value is empty, remove the attribute to keep markup clean
                activePropertyElement.removeAttribute(attrName);
            } else {
                activePropertyElement.setAttribute(attrName, newValue);
            }

            updateLivePreview();
        }
    </script>
</body>

</html>
