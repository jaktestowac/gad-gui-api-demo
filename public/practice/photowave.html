<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦎 GAD - PhotoWeave - Web Image Editor</title>
    <link rel="icon" href="/data/icons/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/fontawesome/css/all.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        /* Checkerboard background for transparency */
        .checkerboard {
            background-color: #1e1e1e;
            background-image:
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        .layer-item.active {
            background-color: #374151;
            border-left: 3px solid #3b82f6;
        }

        canvas {
            touch-action: none;
            image-rendering: pixelated;
        }
    </style>
</head>

<body class="bg-zinc-900 text-gray-200 h-screen w-screen flex flex-col">

    <!-- Top Menu Bar -->
    <div class="h-10 bg-zinc-800 border-b border-zinc-700 flex items-center px-4 space-x-4 text-xs select-none">
        <div class="font-bold text-blue-400 mr-2 text-sm">
            <i class="fas fa-paint-roller"></i>
            PhotoWeave
        </div>
        <a href="/practice/" style="color: white; font-size: small; font-weight: normal;"><i class="fas fa-home"></i></a>
        <button onclick="app.file.newProject()" class="hover:text-white transition">New</button>
        <div class="relative group">
            <button class="hover:text-white transition">File</button>
            <div class="absolute top-full left-0 bg-zinc-800 border border-zinc-700 shadow-xl rounded-b hidden group-hover:block w-32 z-50">
                <label class="block px-4 py-2 hover:bg-zinc-700 cursor-pointer">
                    Open Image <input type="file" class="hidden" id="imgUpload" accept="image/*">
                </label>
                <div onclick="app.file.export()" class="block px-4 py-2 hover:bg-zinc-700 cursor-pointer">Export PNG</div>
            </div>
        </div>
        <button onclick="app.history.undo()" class="hover:text-white transition" title="Ctrl+Z">Undo</button>
        <button onclick="app.history.redo()" class="hover:text-white transition">Redo</button>
        <div class="flex-1"></div>
        <div class="text-zinc-500" id="status-bar">800 x 600px</div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Toolbar -->
        <div class="w-14 bg-zinc-800 border-r border-zinc-700 flex flex-col items-center py-4 space-y-2 z-10">
            <!-- Tool Buttons generated by JS -->
            <div id="toolbar-container" class="flex flex-col gap-2"></div>

            <div class="h-px w-8 bg-zinc-700 my-2"></div>

            <!-- Color Picker -->
            <div class="flex flex-col gap-2 items-center">
                <input type="color" id="primary-color" value="#000000" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
                <input type="color" id="secondary-color" value="#ffffff" class="w-6 h-6 rounded cursor-pointer border-none bg-transparent opacity-70">
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 bg-zinc-900 relative overflow-hidden flex items-center justify-center checkerboard" id="workspace">
            <div class="relative shadow-2xl" id="canvas-wrapper">
                <!-- Main visible canvas -->
                <canvas id="mainCanvas"></canvas>
                <!-- Cursor overlay -->
                <canvas id="cursorCanvas" class="absolute top-0 left-0"></canvas>
            </div>
        </div>

        <!-- Right Panels -->
        <div class="w-72 bg-zinc-800 border-l border-zinc-700 flex flex-col z-10">

            <!-- Properties Panel -->
            <div class="p-4 border-b border-zinc-700">
                <h3 class="text-xs font-bold uppercase text-zinc-500 mb-3">Tool Properties</h3>
                <div class="space-y-3 text-xs">
                    <div class="flex items-center justify-between">
                        <span>Size</span>
                        <input type="range" id="brush-size" min="1" max="100" value="10" class="w-32">
                        <span id="brush-size-val">10px</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span>Opacity</span>
                        <input type="range" id="brush-opacity" min="0" max="100" value="100" class="w-32">
                        <span id="brush-opacity-val">100%</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span>Hardness</span>
                        <input type="range" id="brush-hardness" min="0" max="100" value="80" class="w-32">
                    </div>
                </div>
            </div>

            <!-- Filters Panel -->
            <div class="p-4 border-b border-zinc-700">
                <h3 class="text-xs font-bold uppercase text-zinc-500 mb-2">Filters</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="app.filters.apply('grayscale')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Gray</button>
                    <button onclick="app.filters.apply('invert')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Invert</button>
                    <button onclick="app.filters.apply('sepia')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Sepia</button>
                    <button onclick="app.filters.apply('blur')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Blur</button>
                    <button onclick="app.filters.apply('brightness')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Bright</button>
                    <button onclick="app.filters.apply('noise')" class="bg-zinc-700 hover:bg-zinc-600 rounded p-1 text-xs">Noise</button>
                </div>
            </div>

            <!-- History Panel -->
            <div class="flex flex-col h-40 border-b border-zinc-700">
                <div class="p-3 border-b border-zinc-700 bg-zinc-800 flex justify-between items-center">
                    <span class="text-xs font-bold uppercase text-zinc-500">History</span>
                    <button onclick="app.history.clear()" class="text-xs text-zinc-500 hover:text-white">Clear</button>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto p-1 space-y-1 bg-zinc-900/30">
                    <!-- History items injected here -->
                </div>
            </div>

            <!-- Layers Panel -->
            <div class="flex-1 flex flex-col min-h-0">
                <div class="p-3 border-b border-zinc-700 flex justify-between items-center bg-zinc-800">
                    <span class="text-xs font-bold uppercase text-zinc-500">Layers</span>
                    <div class="flex gap-1">
                        <button onclick="app.layers.add()" class="p-1 hover:bg-zinc-600 rounded" title="New Layer">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </button>
                        <button onclick="app.layers.delete()" class="p-1 hover:bg-zinc-600 rounded" title="Delete Layer">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Layer Properties -->
                <div class="p-2 border-b border-zinc-700 bg-zinc-800/50 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-xs">
                        <select id="layer-blend" onchange="app.layers.updateProps()" class="bg-zinc-700 border-none rounded p-1 w-24">
                            <option value="source-over">Normal</option>
                            <option value="multiply">Multiply</option>
                            <option value="screen">Screen</option>
                            <option value="overlay">Overlay</option>
                            <option value="darken">Darken</option>
                            <option value="lighten">Lighten</option>
                        </select>
                        <div class="flex items-center gap-1">
                            <span>Op:</span>
                            <input type="range" id="layer-opacity" oninput="app.layers.updateProps()" min="0" max="100" value="100" class="w-16">
                        </div>
                    </div>
                </div>

                <!-- Layer List -->
                <div id="layers-list" class="flex-1 overflow-y-auto p-1 space-y-1">
                    <!-- Layers injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Core Application Logic
         */
        const app = {
            config: { width: 800, height: 600 },
            state: {
                activeTool: 'brush',
                brushSize: 10,
                brushColor: '#000000',
                brushOpacity: 1,
                brushHardness: 0.8,
                isDrawing: false,
                lastX: 0,
                lastY: 0,
                layers: [], // { id, name, canvas, ctx, visible, opacity, blendMode, x, y }
                activeLayerIndex: -1,
                history: [], // Stack of state snapshots
                historyStep: -1
            },

            // DOM Elements
            dom: {
                mainCanvas: document.getElementById('mainCanvas'),
                mainCtx: document.getElementById('mainCanvas').getContext('2d'),
                cursorCanvas: document.getElementById('cursorCanvas'),
                layerList: document.getElementById('layers-list')
            },

            init() {
                // Setup Canvas
                this.dom.mainCanvas.width = this.config.width;
                this.dom.mainCanvas.height = this.config.height;
                this.dom.cursorCanvas.width = this.config.width;
                this.dom.cursorCanvas.height = this.config.height;

                this.dom.mainCanvas.style.width = this.config.width + 'px';
                this.dom.mainCanvas.style.height = this.config.height + 'px';
                this.dom.cursorCanvas.style.width = this.config.width + 'px';
                this.dom.cursorCanvas.style.height = this.config.height + 'px';

                // Initialize Tools UI
                this.ui.initTools();
                this.ui.initInputs();

                // Add Background Layer
                this.layers.add('Background', true);

                // Events
                this.events.init();

                // Render initial history
                this.ui.renderHistoryList();

                // Start Render Loop
                this.renderLoop();
            },

            events: {
                init() {
                    const c = app.dom.cursorCanvas; // Capture events on top canvas

                    c.addEventListener('mousedown', e => app.tools.start(e));
                    window.addEventListener('mousemove', e => app.tools.move(e));
                    window.addEventListener('mouseup', e => app.tools.end(e));

                    // Drag and Drop
                    const dropZone = document.body;
                    dropZone.addEventListener('dragover', e => e.preventDefault());
                    dropZone.addEventListener('drop', e => {
                        e.preventDefault();
                        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                            app.file.loadImage(e.dataTransfer.files[0]);
                        }
                    });

                    // Shortcuts
                    document.addEventListener('keydown', e => {
                        if (e.ctrlKey && e.key === 'z') {
                            e.preventDefault();
                            app.history.undo();
                        }
                        if (e.key === '[') app.ui.updateBrushSize(-5);
                        if (e.key === ']') app.ui.updateBrushSize(5);
                    });
                }
            },

            layers: {
                idCounter: 0,

                add(name = null, fillWhite = false) {
                    const id = this.idCounter++;
                    const canvas = document.createElement('canvas');
                    canvas.width = app.config.width;
                    canvas.height = app.config.height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });

                    if (fillWhite) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    const layer = {
                        id,
                        name: name || `Layer ${id + 1}`,
                        canvas,
                        ctx,
                        visible: true,
                        opacity: 1,
                        blendMode: 'source-over',
                        x: 0,
                        y: 0
                    };

                    app.state.layers.unshift(layer); // Add to top
                    app.state.activeLayerIndex = 0;

                    app.history.saveState('New Layer');
                    app.ui.renderLayerList();
                    app.render();
                },

                delete() {
                    if (app.state.layers.length <= 1) return; // Don't delete last layer
                    app.state.layers.splice(app.state.activeLayerIndex, 1);
                    app.state.activeLayerIndex = Math.max(0, app.state.activeLayerIndex - 1);
                    app.history.saveState('Delete Layer');
                    app.ui.renderLayerList();
                    app.render();
                },

                delete() {
                    if (app.state.layers.length <= 1) return; // Don't delete last layer
                    app.state.layers.splice(app.state.activeLayerIndex, 1);
                    app.state.activeLayerIndex = Math.max(0, app.state.activeLayerIndex - 1);
                    app.history.saveState();
                    app.ui.renderLayerList();
                    app.render();
                },

                setActive(index) {
                    app.state.activeLayerIndex = index;
                    app.ui.renderLayerList();
                    // Update properties panel with layer settings
                    const l = app.getActiveLayer();
                    document.getElementById('layer-opacity').value = l.opacity * 100;
                    document.getElementById('layer-blend').value = l.blendMode;
                },

                toggleVisibility(index, e) {
                    e.stopPropagation();
                    app.state.layers[index].visible = !app.state.layers[index].visible;
                    app.ui.renderLayerList();
                    app.render();
                },

                updateProps() {
                    const l = app.getActiveLayer();
                    if (!l) return;
                    l.opacity = document.getElementById('layer-opacity').value / 100;
                    l.blendMode = document.getElementById('layer-blend').value;
                    app.render();
                },

                moveActive(dx, dy) {
                    const l = app.getActiveLayer();
                    if (!l) return;
                    // Move by creating a temp canvas to shift data (simple approach)
                    // Better approach for clone: Just update an x/y offset property and use that in render
                    l.x += dx;
                    l.y += dy;
                    app.render();
                }
            },

            tools: {
                start(e) {
                    const layer = app.getActiveLayer();
                    if (!layer || !layer.visible) return;

                    app.state.isDrawing = true;
                    const pos = app.utils.getMousePos(e);
                    app.state.lastX = pos.x;
                    app.state.lastY = pos.y;

                    // Save state BEFORE modifications for Undo
                    // We cheat a bit and save only on mouse down to save memory, 
                    // ideally we track stroke start. 
                    // For history consistency, we save state at end of stroke, 
                    // but for "Move", we need init state. 

                    // Actually, let's just draw. We save history on MouseUp.

                    if (app.state.activeTool === 'fill') {
                        this.floodFill(layer, pos.x, pos.y, app.state.brushColor);
                        app.render();
                    } else if (app.state.activeTool === 'picker') {
                        this.pickColor(pos);
                    } else {
                        // Dot for click
                        this.draw(e);
                    }
                },

                move(e) {
                    // Update Cursor Overlay
                    const pos = app.utils.getMousePos(e);
                    app.ui.drawCursor(pos);

                    if (!app.state.isDrawing) return;

                    if (app.state.activeTool === 'move') {
                        const dx = pos.x - app.state.lastX;
                        const dy = pos.y - app.state.lastY;
                        app.layers.moveActive(dx, dy);
                        app.state.lastX = pos.x;
                        app.state.lastY = pos.y;
                    } else {
                        this.draw(e);
                    }
                },

                end(e) {
                    if (app.state.isDrawing) {
                        app.state.isDrawing = false;
                        // Save with tool name
                        const toolName = app.state.activeTool.charAt(0).toUpperCase() + app.state.activeTool.slice(1);
                        app.history.saveState(toolName + ' Tool');
                    }
                },

                draw(e) {
                    const layer = app.getActiveLayer();
                    if (!layer) return;

                    const ctx = layer.ctx;
                    const pos = app.utils.getMousePos(e);

                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // Brush Dynamics
                    ctx.lineWidth = app.state.brushSize;

                    // Adjust position based on layer offset
                    const lx = pos.x - layer.x;
                    const ly = pos.y - layer.y;
                    const lastLx = app.state.lastX - layer.x;
                    const lastLy = app.state.lastY - layer.y;

                    if (app.state.activeTool === 'brush') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = app.state.brushColor;
                        ctx.globalAlpha = app.state.brushOpacity;
                        // Hardness simulation (shadowBlur) - simple version
                        if (app.state.brushHardness < 0.9) {
                            ctx.shadowBlur = (1 - app.state.brushHardness) * 10;
                            ctx.shadowColor = app.state.brushColor;
                        } else {
                            ctx.shadowBlur = 0;
                        }
                    } else if (app.state.activeTool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.globalAlpha = app.state.brushOpacity;
                        ctx.shadowBlur = 0;
                    } else {
                        return; // Move handled elsewhere
                    }

                    ctx.beginPath();
                    ctx.moveTo(lastLx, lastLy);
                    ctx.lineTo(lx, ly);
                    ctx.stroke();

                    // Reset context pollution
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.globalCompositeOperation = 'source-over';

                    app.state.lastX = pos.x;
                    app.state.lastY = pos.y;
                    app.render();
                },

                floodFill(layer, startX, startY, hexColor) {
                    // Adjust for layer offset
                    const lx = Math.floor(startX - layer.x);
                    const ly = Math.floor(startY - layer.y);

                    if (lx < 0 || ly < 0 || lx >= app.config.width || ly >= app.config.height) return;

                    const ctx = layer.ctx;
                    const imgData = ctx.getImageData(0, 0, app.config.width, app.config.height);
                    const data = imgData.data;

                    // Convert Hex to RGBA
                    const r = parseInt(hexColor.slice(1, 3), 16);
                    const g = parseInt(hexColor.slice(3, 5), 16);
                    const b = parseInt(hexColor.slice(5, 7), 16);
                    const a = 255;

                    const startPos = (ly * app.config.width + lx) * 4;
                    const startR = data[startPos], startG = data[startPos + 1], startB = data[startPos + 2], startA = data[startPos + 3];

                    if (startR === r && startG === g && startB === b && startA === a) return;

                    const matchStartColor = (pos) => {
                        return data[pos] === startR && data[pos + 1] === startG && data[pos + 2] === startB && data[pos + 3] === startA;
                    };

                    const colorPixel = (pos) => {
                        data[pos] = r; data[pos + 1] = g; data[pos + 2] = b; data[pos + 3] = a;
                    };

                    const pixelStack = [[lx, ly]];

                    while (pixelStack.length) {
                        const newPos = pixelStack.pop();
                        const x = newPos[0];
                        let y = newPos[1];
                        let pixelPos = (y * app.config.width + x) * 4;

                        while (y-- >= 0 && matchStartColor(pixelPos)) {
                            pixelPos -= app.config.width * 4;
                        }
                        pixelPos += app.config.width * 4;
                        y++;

                        let reachLeft = false;
                        let reachRight = false;

                        while (y++ < app.config.height - 1 && matchStartColor(pixelPos)) {
                            colorPixel(pixelPos);

                            if (x > 0) {
                                if (matchStartColor(pixelPos - 4)) {
                                    if (!reachLeft) { pixelStack.push([x - 1, y]); reachLeft = true; }
                                } else if (reachLeft) { reachLeft = false; }
                            }
                            if (x < app.config.width - 1) {
                                if (matchStartColor(pixelPos + 4)) {
                                    if (!reachRight) { pixelStack.push([x + 1, y]); reachRight = true; }
                                } else if (reachRight) { reachRight = false; }
                            }
                            pixelPos += app.config.width * 4;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                },

                pickColor(pos) {
                    // Get pixel from MAIN canvas (composite)
                    const p = app.dom.mainCtx.getImageData(pos.x, pos.y, 1, 1).data;
                    const hex = app.utils.rgbToHex(p[0], p[1], p[2]);
                    app.state.brushColor = hex;
                    document.getElementById('primary-color').value = hex;
                    app.state.activeTool = 'brush'; // Switch back to brush automatically
                    app.ui.initTools();
                }
            },

            filters: {
                apply(type) {
                    const layer = app.getActiveLayer();
                    if (!layer) return;

                    const ctx = layer.ctx;
                    const imgData = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i + 1], b = data[i + 2];

                        if (type === 'grayscale') {
                            const avg = 0.34 * r + 0.5 * g + 0.16 * b;
                            data[i] = avg; data[i + 1] = avg; data[i + 2] = avg;
                        }
                        else if (type === 'invert') {
                            data[i] = 255 - r; data[i + 1] = 255 - g; data[i + 2] = 255 - b;
                        }
                        else if (type === 'sepia') {
                            data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                            data[i + 1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                            data[i + 2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
                        }
                        else if (type === 'brightness') {
                            data[i] += 40; data[i + 1] += 40; data[i + 2] += 40;
                        }
                        else if (type === 'noise') {
                            const rand = (0.5 - Math.random()) * 50;
                            data[i] += rand; data[i + 1] += rand; data[i + 2] += rand;
                        }
                    }

                    // Simple Box Blur
                    if (type === 'blur') {
                        app.filters.boxBlur(imgData, layer.canvas.width, layer.canvas.height);
                    } else {
                        ctx.putImageData(imgData, 0, 0);
                    }

                    app.render();
                    app.history.saveState('Filter: ' + type);
                },

                boxBlur(imgData, w, h) {
                    // Simplified blur to keep code small
                    // In a real app, use a StackBlur or Gaussian algorithm
                    // Accessing Canvas API filter is easier
                    const layer = app.getActiveLayer();
                    const temp = document.createElement('canvas');
                    temp.width = w; temp.height = h;
                    const tCtx = temp.getContext('2d');
                    tCtx.putImageData(imgData, 0, 0);

                    layer.ctx.filter = 'blur(4px)';
                    layer.ctx.clearRect(0, 0, w, h);
                    layer.ctx.drawImage(temp, 0, 0);
                    layer.ctx.filter = 'none';
                }
            },

            history: {
                saveState(action = 'Action') {
                    // Remove redo states if we diverge
                    if (app.state.historyStep < app.state.history.length - 1) {
                        app.state.history = app.state.history.slice(0, app.state.historyStep + 1);
                    }

                    const stateSnapshot = app.state.layers.map(l => ({
                        id: l.id,
                        name: l.name,
                        visible: l.visible,
                        opacity: l.opacity,
                        blendMode: l.blendMode,
                        x: l.x,
                        y: l.y,
                        data: l.canvas.toDataURL()
                    }));

                    app.state.history.push({
                        action: action,
                        layers: stateSnapshot,
                        activeLayerIndex: app.state.activeLayerIndex
                    });

                    // Limit to 20 items
                    if (app.state.history.length > 20) app.state.history.shift();

                    app.state.historyStep = app.state.history.length - 1;
                    app.ui.renderHistoryList();
                },

                undo() {
                    if (app.state.historyStep > 0) {
                        app.state.historyStep--;
                        this.loadState(app.state.history[app.state.historyStep]);
                        app.ui.renderHistoryList();
                    }
                },

                redo() {
                    if (app.state.historyStep < app.state.history.length - 1) {
                        app.state.historyStep++;
                        this.loadState(app.state.history[app.state.historyStep]);
                        app.ui.renderHistoryList();
                    }
                },

                jumpTo(index) {
                    if (index >= 0 && index < app.state.history.length) {
                        app.state.historyStep = index;
                        this.loadState(app.state.history[index]);
                        app.ui.renderHistoryList();
                    }
                },

                clear() {
                    // Keep current state but reset history
                    const current = app.state.history[app.state.historyStep];
                    app.state.history = [current];
                    app.state.historyStep = 0;
                    app.ui.renderHistoryList();
                },

                loadState(state) {
                    // Reconstruct layers
                    app.state.layers = [];
                    let loadedCount = 0;

                    state.layers.forEach(lState => {
                        const canvas = document.createElement('canvas');
                        canvas.width = app.config.width;
                        canvas.height = app.config.height;
                        const ctx = canvas.getContext('2d');

                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0);
                            loadedCount++;
                            if (loadedCount === state.layers.length) app.render();
                        };
                        img.src = lState.data;

                        app.state.layers.push({
                            id: lState.id,
                            name: lState.name,
                            canvas,
                            ctx,
                            visible: lState.visible,
                            opacity: lState.opacity,
                            blendMode: lState.blendMode,
                            x: lState.x,
                            y: lState.y
                        });
                    });

                    app.state.activeLayerIndex = state.activeLayerIndex;
                    app.ui.renderLayerList();
                }
            },

            file: {
                newProject() {
                    if (confirm('Clear all layers and start new?')) {
                        app.state.layers = [];
                        app.layers.add('Background', true);
                        // Reset history is handled by add() calling saveState('New Layer')
                        // But we want to wipe previous history
                        app.state.history = [];
                        app.history.saveState('New Project');
                    }
                },
                loadImage(file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            app.layers.add(file.name);
                            const layer = app.getActiveLayer();
                            // Center image
                            const x = (app.config.width - img.width) / 2;
                            const y = (app.config.height - img.height) / 2;

                            layer.ctx.drawImage(img, 0, 0, img.width, img.height, x, y, img.width, img.height);
                            // Explicitly update the last history item (created by add layer) to reflect image load
                            // OR just save a new state. Let's save new state for simplicity.
                            app.history.saveState('Import Image');
                            app.render();
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                    document.getElementById('imgUpload').value = '';
                },
                export() {
                    const link = document.createElement('a');
                    link.download = 'photoweave-export.png';
                    link.href = app.dom.mainCanvas.toDataURL();
                    link.click();
                }
            },

            // Rendering Logic
            render() {
                const ctx = app.dom.mainCtx;
                ctx.clearRect(0, 0, app.config.width, app.config.height);

                // Draw layers from bottom to top
                // Array is Top -> Bottom, so reverse for drawing
                [...app.state.layers].reverse().forEach(layer => {
                    if (layer.visible) {
                        ctx.save();
                        ctx.globalAlpha = layer.opacity;
                        ctx.globalCompositeOperation = layer.blendMode;
                        ctx.drawImage(layer.canvas, layer.x, layer.y);
                        ctx.restore();
                    }
                });
            },

            renderLoop() {
                // Keep animation frame for cursor smooth updates if needed
                requestAnimationFrame(() => app.renderLoop());
            },

            getActiveLayer() {
                return app.state.layers[app.state.activeLayerIndex];
            },

            // UI Helpers
            ui: {
                toolsData: [
                    { id: 'move', icon: '<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M9 19l3 3 3-3M2 12h20M12 2v20"/>', label: 'Move (V)' },
                    { id: 'brush', icon: '<path d="M18 13l-5 5L3 8l5-5 5 5zm0 0l3-3a2 2 0 0 1 2.8 2.8l-7.3 7.3a6 6 0 0 1-3.2 1.6L8 22"/>', label: 'Brush (B)' },
                    { id: 'eraser', icon: '<path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/>', label: 'Eraser (E)' },
                    { id: 'fill', icon: '<path d="M19 11l-8-8-9 9 8 8 5-5 6 6"/><path d="M16 14l-2 2"/>', label: 'Fill (G)' },
                    { id: 'picker', icon: '<path d="M2 22l5.5-5.5M2 22l2.5-12.5 8 8L2 22zM12 9l8-8 3 3-8 8"/>', label: 'Picker (I)' },
                ],

                initTools() {
                    const container = document.getElementById('toolbar-container');
                    container.innerHTML = '';
                    this.toolsData.forEach(tool => {
                        const btn = document.createElement('button');
                        btn.className = `p-3 rounded hover:bg-zinc-700 transition tool-btn ${app.state.activeTool === tool.id ? 'active' : 'text-zinc-400'}`;
                        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${tool.icon}</svg>`;
                        btn.title = tool.label;
                        btn.onclick = () => {
                            app.state.activeTool = tool.id;
                            app.ui.initTools();
                        };
                        container.appendChild(btn);
                    });
                },

                renderLayerList() {
                    const list = document.getElementById('layers-list');
                    list.innerHTML = '';

                    app.state.layers.forEach((layer, index) => {
                        const el = document.createElement('div');
                        const isActive = index === app.state.activeLayerIndex;
                        el.className = `layer-item p-2 flex items-center justify-between text-xs cursor-pointer rounded mb-1 hover:bg-zinc-700 ${isActive ? 'active' : 'bg-zinc-800'}`;

                        el.innerHTML = `
                            <div class="flex items-center gap-2 overflow-hidden">
                                <button class="hover:text-white ${layer.visible ? 'text-gray-300' : 'text-gray-600'}" onclick="app.layers.toggleVisibility(${index}, event)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                                <span class="truncate select-none">${layer.name}</span>
                            </div>
                        `;
                        el.onclick = () => app.layers.setActive(index);
                        list.appendChild(el);
                    });
                },

                renderHistoryList() {
                    const list = document.getElementById('history-list');
                    list.innerHTML = '';

                    // Show latest at bottom? Standard photoshop is top=oldest, bottom=newest. 
                    // Let's scroll to bottom automatically if needed.

                    app.state.history.forEach((step, index) => {
                        const el = document.createElement('div');
                        const isActive = index === app.state.historyStep;

                        // Style: Active step is highlighted. Steps AFTER active (redoable) are dimmed.
                        const isFuture = index > app.state.historyStep;

                        el.className = `p-1 px-2 text-xs cursor-pointer flex items-center gap-2 select-none ${isActive ? 'bg-blue-600 text-white' : 'hover:bg-zinc-700'} ${isFuture ? 'text-zinc-500 italic' : ''}`;

                        el.innerHTML = `
                            <span class="w-4 text-center opacity-50">${index + 1}</span>
                            <span>${step.action || 'Action'}</span>
                        `;

                        el.onclick = () => app.history.jumpTo(index);
                        list.appendChild(el);
                    });

                    // Auto scroll to active
                    if (list.lastElementChild) {
                        list.scrollTop = list.scrollHeight;
                    }
                },

                initInputs() {
                    document.getElementById('primary-color').oninput = (e) => app.state.brushColor = e.target.value;
                    document.getElementById('brush-size').oninput = (e) => {
                        app.state.brushSize = parseInt(e.target.value);
                        document.getElementById('brush-size-val').innerText = e.target.value + 'px';
                    };
                    document.getElementById('brush-opacity').oninput = (e) => {
                        app.state.brushOpacity = e.target.value / 100;
                        document.getElementById('brush-opacity-val').innerText = e.target.value + '%';
                    };
                    document.getElementById('brush-hardness').oninput = (e) => {
                        app.state.brushHardness = e.target.value / 100;
                    };
                    document.getElementById('imgUpload').onchange = (e) => {
                        if (e.target.files[0]) app.file.loadImage(e.target.files[0]);
                    }
                },

                drawCursor(pos) {
                    const ctx = app.dom.cursorCanvas.getContext('2d');
                    ctx.clearRect(0, 0, app.config.width, app.config.height);

                    // Only draw brush cursor inside bounds
                    if (pos.x < 0 || pos.y < 0 || pos.x > app.config.width || pos.y > app.config.height) return;

                    if (app.state.activeTool === 'brush' || app.state.activeTool === 'eraser') {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, app.state.brushSize / 2, 0, Math.PI * 2);
                        ctx.strokeStyle = '#777';
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, app.state.brushSize / 2 - 1, 0, Math.PI * 2);
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();
                    }
                },

                updateBrushSize(delta) {
                    let s = app.state.brushSize + delta;
                    s = Math.max(1, Math.min(100, s));
                    app.state.brushSize = s;
                    document.getElementById('brush-size').value = s;
                    document.getElementById('brush-size-val').innerText = s + 'px';
                }
            },

            utils: {
                getMousePos(e) {
                    const rect = app.dom.mainCanvas.getBoundingClientRect();
                    return {
                        x: (e.clientX - rect.left),
                        y: (e.clientY - rect.top)
                    };
                },
                rgbToHex(r, g, b) {
                    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
                }
            }
        };

        // Boot
        window.onload = () => app.init();
    </script>
</body>
