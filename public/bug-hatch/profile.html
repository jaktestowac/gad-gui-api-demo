<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/data/icons/favicon.png" />
    <title>Profile - BugHatch</title>
    <script src="/bug-hatch/js/common.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/bug-hatch/css/bh-fallback.css">
    <link href="/css/fontawesome/css/all.min.css" rel="stylesheet" />
</head>

<body class="bh-bg-dark bh-text-light bg-neutral-950 text-neutral-100 min-h-screen">
    <!-- Demo Banner -->
    <div class="bh-demo-banner hidden flex items-center justify-between gap-3 px-4 py-2 text-sm border border-amber-500/30 bg-amber-500/10 text-amber-100" id="demo-banner">
        <span class="demo-banner-icon">🎯</span>
        <div class="demo-banner-text">
            <strong>Demo Mode:</strong> You're exploring BugHatch in read-only mode. All features are visible, but you cannot create, edit, or delete items.
        </div>
        <a href="/bug-hatch/signup.html" class="bh-demo-cta">Sign Up Free</a>
    </div>
    <!-- Navigation -->
    <nav class="bh-navbar px-4 py-3 sticky top-0 z-20 border-b border-neutral-800 bg-neutral-950/70 backdrop-blur">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="gad-link">🦎 GAD</a>
            <a href="/bug-hatch/dashboard.html" class="bh-navbar-brand bh-brand-badge inline-flex items-center gap-2 text-lg font-semibold">
                <span class="bh-logo-icon text-2xl">🐛</span>
                <span>BugHatch</span>
            </a>

            <div class="flex items-center gap-4">
                <a href="/bug-hatch/dashboard.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">
                    Dashboard
                </a>
                <a href="/bug-hatch/issues.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">
                    Issues
                </a>
                <a href="/bug-hatch/analytics.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">
                    Analytics
                </a>
                <a href="/bug-hatch/invitations.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">
                    Invitations
                </a>
                <button id="logoutBtn" class="bh-btn bh-btn-danger bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="bh-max-w-screen bh-mx-auto bh-p-xl max-w-4xl">
        <div class="bh-card bh-card-glow bh-mb-xl bh-text-center">
            <h1 class="bh-heading-display bh-heading-gradient bh-mb-sm">User Profile</h1>
            <p class="bh-text-dim bh-text-sm">Manage your account settings and preferences</p>
        </div>

        <!-- Profile Form -->
        <div class="bh-card bh-card-glow bh-mb-xl">
            <h2 class="bh-heading-gradient bh-text-lg bh-mb-md">Profile Information</h2>

            <form id="profileForm" class="bh-stack bh-gap-sm">
                <div class="bh-flex bh-gap-sm bh-wrap">
                    <label class="bh-field bh-flex-1">
                        <span class="bh-label">Full Name</span>
                        <input type="text" id="name" name="name" class="bh-input" placeholder="Enter your full name" required>
                    </label>

                    <label class="bh-field bh-flex-1">
                        <span class="bh-label">Email Address</span>
                        <input type="email" id="email" name="email" class="bh-input" placeholder="Enter your email" required>
                    </label>
                </div>

                <div class="bh-flex bh-gap-sm">
                    <button type="submit" id="saveProfileBtn" class="bh-btn bh-btn-primary px-2 ">
                        Save Changes
                    </button>
                    <button type="button" id="cancelBtn" class="bh-btn bh-btn-secondary px-2">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Change Password Form -->
        <div class="bh-card bh-card-glow">
            <h2 class="bh-heading-gradient bh-text-lg bh-mb-md">Change Password</h2>

            <form id="passwordForm" class="bh-stack bh-gap-sm" style="max-width: 24rem;">
                <label class="bh-field">
                    <span class="bh-label">Current Password</span>
                    <input type="password" id="currentPassword" name="currentPassword" class="bh-input" placeholder="Enter current password" required>
                </label>

                <label class="bh-field">
                    <span class="bh-label">New Password</span>
                    <input type="password" id="newPassword" name="newPassword" class="bh-input" placeholder="Enter new password" required>
                </label>

                <label class="bh-field">
                    <span class="bh-label">Confirm New Password</span>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="bh-input" placeholder="Confirm new password" required>
                </label>

                <button type="submit" id="changePasswordBtn" class="bh-btn bh-btn-primary px-2">
                    Change Password
                </button>
            </form>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script src="/bug-hatch/js/auth.js"></script>
    <script src="/bug-hatch/js/demo-propagate.js"></script>
    <script src="/bug-hatch/js/toast.js"></script>
    <script src="/bug-hatch/js/profile.js"></script>
</body>

</html>
