<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Invitations - BugHatch</title>
    <link rel="icon" href="/data/icons/favicon.png" />
    <script src="/bug-hatch/js/common.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/bug-hatch/css/bh-fallback.css">
</head>

<body class="bh-bg-dark bh-text-light bg-neutral-950 text-neutral-100">
    <nav class="bh-navbar px-4 py-3 sticky top-0 z-20 border-b border-neutral-800 bg-neutral-950/70 backdrop-blur">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="gad-link">🦎 GAD</a>
            <a href="/bug-hatch/dashboard.html" class="bh-navbar-brand bh-brand-badge inline-flex items-center gap-2 text-lg font-semibold"><span class="bh-logo-icon text-2xl">🐛</span><span>BugHatch</span></a>
            <div class="flex gap-2">
                <a href="/bug-hatch/dashboard.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">Dashboard</a>
                <a href="/bug-hatch/issues.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">Issues</a>
                <a href="/bug-hatch/profile.html" class="bh-btn bh-btn-ghost bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium text-neutral-200 hover:bg-neutral-800 px-2.5 py-1.5">Profile</a>
                <button id="logoutBtn" class="bh-btn bh-btn-danger bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-neutral-100 mb-2">My Invitations</h1>
            <p class="text-neutral-400">View and respond to project invitations</p>
        </div>

        <div id="loadingState" class="bh-card bh-card-glow rounded-xl border border-neutral-800 bg-neutral-900/40 p-6">
            <div class="flex items-center gap-3">
                <div class="animate-spin h-5 w-5 border-2 border-emerald-500 border-t-transparent rounded-full"></div>
                <span class="text-neutral-400">Loading invitations...</span>
            </div>
        </div>

        <div id="emptyState" class="bh-card bh-card-glow rounded-xl border border-neutral-800 bg-neutral-900/40 p-6 hidden">
            <div class="text-center py-8">
                <div class="text-4xl mb-4">📬</div>
                <h3 class="text-lg font-medium text-neutral-200 mb-2">No Invitations</h3>
                <p class="text-neutral-400">You don't have any pending project invitations at the moment.</p>
            </div>
        </div>

        <div id="invitationsList" class="space-y-4 hidden">
            <!-- Invitations will be rendered here -->
        </div>

        <div id="errorState" class="bh-alert bh-alert-error rounded-md border border-red-500/40 bg-red-500/10 text-red-200 text-sm px-4 py-3 hidden">
            <span id="errorMessage"></span>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50"></div>

    <script src="/bug-hatch/js/common.js"></script>
    <script src="/bug-hatch/js/auth.js"></script>
    <script src="/bug-hatch/js/toast.js"></script>
    <script>
        // Invitations Page Logic
        (function () {
            let currentUser = null;

            async function init() {
                currentUser = await window.bugHatchAuth.checkAuth();
                if (!currentUser) {
                    window.location.href = '/bug-hatch/login.html';
                    return;
                }

                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', window.bugHatchAuth.handleLogout);
                }

                await loadInvitations();
            }

            async function loadInvitations() {
                const loadingState = document.getElementById('loadingState');
                const emptyState = document.getElementById('emptyState');
                const invitationsList = document.getElementById('invitationsList');
                const errorState = document.getElementById('errorState');

                try {
                    const resp = await fetch('/api/bug-hatch/invitations/my', {
                        credentials: 'include'
                    });
                    const data = await resp.json();

                    loadingState.classList.add('hidden');

                    if (!resp.ok) {
                        throw new Error(data.error?.message || data.error || 'Failed to load invitations');
                    }

                    const invitations = data.data?.invitations || [];

                    if (invitations.length === 0) {
                        emptyState.classList.remove('hidden');
                        return;
                    }

                    invitationsList.classList.remove('hidden');
                    renderInvitations(invitations);

                } catch (error) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    document.getElementById('errorMessage').textContent = error.message;
                }
            }

            function renderInvitations(invitations) {
                const container = document.getElementById('invitationsList');
                container.innerHTML = '';

                invitations.forEach(inv => {
                    const card = document.createElement('div');
                    card.className = 'bh-card bh-card-glow rounded-xl border border-neutral-800 bg-neutral-900/40 p-6';
                    card.dataset.invitationId = inv.id;
                    card.dataset.token = inv.token;

                    const statusBadge = getStatusBadge(inv.status);
                    const isPending = inv.status === 'pending';
                    const isExpired = inv.expiresAt && new Date() > new Date(inv.expiresAt);

                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="text-lg font-semibold text-neutral-100">${escapeHtml(inv.projectName)}</span>
                                    <span class="bh-badge inline-flex items-center rounded-full border border-neutral-700/60 bg-neutral-900/60 px-2 py-0.5 text-xs text-neutral-300">${escapeHtml(inv.projectKey)}</span>
                                    ${statusBadge}
                                </div>
                                <p class="text-sm text-neutral-400 mb-1">
                                    You've been invited to join this project
                                </p>
                                <p class="text-xs text-neutral-500">
                                    Sent: ${formatDate(inv.createdAt)}
                                    ${inv.expiresAt ? ` • Expires: ${formatDate(inv.expiresAt)}` : ''}
                                </p>
                                ${isExpired && isPending ? '<p class="text-xs text-red-400 mt-1">This invitation has expired</p>' : ''}
                            </div>
                            <div class="flex gap-2">
                                ${isPending && !isExpired ? `
                                    <button class="bh-btn bh-btn-primary bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium bg-emerald-500 text-neutral-900 hover:bg-emerald-600 px-3 py-1.5" onclick="acceptInvitation('${inv.token}')">
                                        Accept
                                    </button>
                                    <button class="bh-btn bh-btn-secondary bh-btn-sm inline-flex items-center justify-center rounded-md text-sm font-medium border border-neutral-700/70 bg-neutral-900 hover:bg-neutral-800 text-neutral-100 px-3 py-1.5" onclick="rejectInvitation('${inv.token}')">
                                        Decline
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            }

            function getStatusBadge(status) {
                switch (status) {
                    case 'pending':
                        return '<span class="inline-flex items-center rounded-full border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 text-xs text-amber-300">Pending</span>';
                    case 'accepted':
                        return '<span class="inline-flex items-center rounded-full border border-emerald-500/30 bg-emerald-500/10 px-2 py-0.5 text-xs text-emerald-300">Accepted</span>';
                    case 'rejected':
                        return '<span class="inline-flex items-center rounded-full border border-red-500/30 bg-red-500/10 px-2 py-0.5 text-xs text-red-300">Declined</span>';
                    case 'expired':
                        return '<span class="inline-flex items-center rounded-full border border-neutral-500/30 bg-neutral-500/10 px-2 py-0.5 text-xs text-neutral-400">Expired</span>';
                    default:
                        return '';
                }
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            window.acceptInvitation = async function (token) {
                try {
                    const resp = await fetch(`/api/bug-hatch/invitations/${encodeURIComponent(token)}/accept`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    const data = await resp.json();

                    if (!resp.ok) {
                        throw new Error(data.error?.message || data.error || 'Failed to accept invitation');
                    }

                    if (window.bhToast) {
                        window.bhToast.show('Invitation accepted! You are now a member of the project.', { type: 'success' });
                    }

                    await loadInvitations();
                } catch (error) {
                    if (window.bhToast) {
                        window.bhToast.show(error.message, { type: 'error' });
                    } else {
                        alert(error.message);
                    }
                }
            };

            window.rejectInvitation = async function (token) {
                const confirmed = await window.showConfirmModal({
                    title: 'Decline Invitation',
                    message: 'Are you sure you want to decline this invitation?',
                    confirmText: 'Decline',
                    cancelText: 'Cancel',
                    confirmClass: 'bg-red-600 hover:bg-red-500'
                });
                if (!confirmed) return;

                try {
                    const resp = await fetch(`/api/bug-hatch/invitations/${encodeURIComponent(token)}/reject`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    const data = await resp.json();

                    if (!resp.ok) {
                        throw new Error(data.error?.message || data.error || 'Failed to decline invitation');
                    }

                    if (window.bhToast) {
                        window.bhToast.show('Invitation declined.', { type: 'info' });
                    }

                    await loadInvitations();
                } catch (error) {
                    if (window.bhToast) {
                        window.bhToast.show(error.message, { type: 'error' });
                    } else {
                        alert(error.message);
                    }
                }
            };

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>

</html>
