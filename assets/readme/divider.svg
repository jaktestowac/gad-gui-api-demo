<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#9d84ff"/>
      <stop offset="0.8" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .s { animation: run 3.5s linear infinite; }
      @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#g)"/>
  <rect x="0" y="9" width="1200" height="6" fill="url(#g)" filter="url(#blur)" opacity="0.6"/>
  <rect class="s" x="0" y="10" width="200" height="4" fill="url(#spark)"/>
  <g fill="#e9e6ff">
    <rect x="596" y="8" width="8" height="8" transform="rotate(45 600 12)"/>
  </g>
</svg>
